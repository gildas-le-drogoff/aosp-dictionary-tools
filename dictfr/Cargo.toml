[package]
name = "dictfr"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

[profile.release]
lto = "thin"
codegen-units = 1
